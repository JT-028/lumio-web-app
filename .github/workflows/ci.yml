# Lint is `npm run typecheck` (src) then `npm run typecheck:test` (test/**). This repo has no eslint script.
# Deploy does not run on feature branches and does not deploy production.
# No secrets in this file. Every job runs on ubuntu-latest in the plain checkout:
# test/m1-repo.test.ts finds the repo root from its own file URL, so no fixed path is needed.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Typecheck tests
        run: npm run typecheck:test

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  security-scan:
    name: security-scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install
        run: npm ci
      - name: npm audit
        run: npm audit

  deploy:
    name: deploy
    needs: security-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Do not deploy production
        run: echo "Production deploy is disabled. This job does not run on feature branches and does not call Vercel."
